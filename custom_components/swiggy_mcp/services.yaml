add_to_cart:
  name: Add to Instamart Cart
  description: >
    Search for a grocery item by name and add it to your Swiggy Instamart cart.
    Searches products and adds the best fuzzy match by spinId.
    The cart is automatically merged — existing items are preserved.
  fields:
    query:
      name: Query
      description: Name of the grocery item to search for (e.g. "Maggi Noodles 70g", "Amul Butter 500g")
      required: true
      example: "Maggi Noodles 70g"
      selector:
        text:
    quantity:
      name: Quantity
      description: Number of units to add (default 1)
      example: 2
      selector:
        number:
          min: 1
          max: 20
          mode: box

clear_cart:
  name: Clear Instamart Cart
  description: Remove all items from your Swiggy Instamart cart.

place_instamart_order:
  name: Place Instamart Order
  description: >
    Place your current Swiggy Instamart cart as a grocery order (Cash on Delivery).
    ⚠️ IRREVERSIBLE — orders cannot be cancelled after placement.
    Cart value must be under ₹1000 (Swiggy MCP beta limit).
    Always review your cart using the Instamart Cart Items sensor before calling this.
  fields:
    confirmed:
      name: Confirmed
      description: Must be true to confirm you want to place the order
      required: true
      selector:
        boolean:
