add_to_cart:
  name: Add to Cart
  description: >
    Search for an item by name and add it to your Swiggy Food or Instamart cart.
    For Food: searches menus and adds the first matching dish.
    For Instamart: searches products and adds by spinId.
  fields:
    item:
      name: Item
      description: Name of the item to search for and add (e.g. "Maggi Noodles 70g", "Chicken Biryani")
      required: true
      example: "Maggi Noodles 70g"
      selector:
        text:
    quantity:
      name: Quantity
      description: Number of units to add (default 1)
      example: 2
      selector:
        number:
          min: 1
          max: 20
          mode: box
    service:
      name: Service
      description: Which Swiggy service — food or instamart
      default: instamart
      selector:
        select:
          options:
            - food
            - instamart

clear_cart:
  name: Clear Cart
  description: Remove all items from your Swiggy Food or Instamart cart.
  fields:
    service:
      name: Service
      description: Which cart to clear — food or instamart
      default: food
      selector:
        select:
          options:
            - food
            - instamart

place_order:
  name: Place Food Order
  description: >
    Place your current Swiggy food delivery order (Cash on Delivery).
    ⚠️ IRREVERSIBLE — orders cannot be cancelled after placement.
    Cart value must be under ₹1000 (Swiggy MCP beta limit).
    Always review your cart using the Swiggy Cart Items sensor before calling this.
  fields:
    confirmed:
      name: Confirmed
      description: Must be true to confirm you want to place the order
      required: true
      selector:
        boolean:

reorder_last:
  name: Reorder Last Order
  description: >
    Fetch details of the last order for reference.
    Note: Swiggy MCP does not support automatic reorder — use this to see
    what was ordered, then use add_to_cart to rebuild the cart manually.
