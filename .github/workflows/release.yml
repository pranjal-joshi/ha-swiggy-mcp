name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update manifest version
        run: |
          TAG=${GITHUB_REF_NAME#v}
          jq --arg version "$TAG" '.version = $version' \
            custom_components/swiggy_mcp/manifest.json > /tmp/manifest.json
          mv /tmp/manifest.json custom_components/swiggy_mcp/manifest.json

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/swiggy_mcp/manifest.json
          git commit -m "chore: bump version to ${GITHUB_REF_NAME}" || echo "Nothing to commit"
          git push origin HEAD:main || echo "Push skipped"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            custom_components/swiggy_mcp/*.py
            custom_components/swiggy_mcp/*.json
            custom_components/swiggy_mcp/*.yaml
